<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小金井市 水害サバイバルクイズ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;background:#0b2a45;color:#1d2b36;min-height:100vh}
  button{-webkit-appearance:none;appearance:none;color:inherit}
  ruby rt{font-size:.5em;font-weight:normal;letter-spacing:0}
  .app{max-width:1000px;margin:0 auto;padding:18px;min-height:100vh;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column;animation:fade .35s ease}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{font-size:34px;color:#fff;text-align:center;line-height:1.5}
  .sub{color:#cfe3f5;text-align:center;font-size:18px;margin:10px 0 18px;line-height:1.9}
  .start-hero{border-radius:18px;overflow:hidden;margin-bottom:18px;line-height:0}
  .btn{display:block;width:100%;border:none;border-radius:14px;font-size:22px;font-weight:bold;padding:18px;cursor:pointer;font-family:inherit}
  .btn-primary{background:#ff8a00;color:#fff;box-shadow:0 5px 0 #c26900}
  .btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c26900}
  .lv-label{color:#fff;font-size:22px;font-weight:bold;text-align:center;margin:4px 0 12px}
  .lv-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .lv-btn{border:none;border-radius:18px;padding:20px 12px;cursor:pointer;font-family:inherit;text-align:center;line-height:1.5}
  .lv-btn .n{font-size:30px;font-weight:900;display:block}
  .lv-btn .d{font-size:15px;display:block;margin-top:6px}
  .lv-easy{background:#38b000;color:#fff;-webkit-text-fill-color:#fff;box-shadow:0 6px 0 #237000}
  .lv-hard{background:#d62828;color:#fff;-webkit-text-fill-color:#fff;box-shadow:0 6px 0 #8b0000}
  .lv-btn:active{transform:translateY(4px);box-shadow:none}
  .lvtag{display:inline-block;font-size:16px;padding:3px 12px;border-radius:16px;color:#fff;margin-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .sc-btn{background:#fff;border:4px solid transparent;border-radius:16px;padding:18px 10px;text-align:center;cursor:pointer;font-family:inherit;transition:.15s;color:#0b2a45}
  .sc-btn:active{border-color:#ff8a00;transform:scale(.97)}
  .sc-btn .ic{font-size:52px}
  .sc-btn .t{font-size:21px;font-weight:bold;margin-top:6px;color:#0b2a45;-webkit-text-fill-color:#0b2a45;line-height:1.7}
  .sc-btn .d{font-size:14px;color:#3d4f61;-webkit-text-fill-color:#3d4f61;margin-top:4px;line-height:1.7}
  .back{background:none;border:none;color:#9db7cf;font-size:17px;margin-top:16px;cursor:pointer;font-family:inherit;text-decoration:underline}
  .topbar{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:10px;gap:10px}
  .topbar .sc{font-size:18px;font-weight:bold}
  .progress{flex:1;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;max-width:380px}
  .progress div{height:100%;background:#ff8a00;transition:width .4s}
  .qno{font-size:18px;font-weight:bold;white-space:nowrap}
  .snd{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;-webkit-text-fill-color:#fff;border-radius:22px;padding:6px 12px;font-size:16px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .scene{width:100%;border-radius:16px;overflow:hidden;background:#000;line-height:0;position:relative}
  .scene svg,.scene img,.scene video{width:100%;height:auto;display:block}
  .scene.shake{animation:shake .5s infinite}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
  .rainfall{animation:fall .38s linear infinite}
  @keyframes fall{from{transform:translate(0,-120px)}to{transform:translate(-40px,0)}}
  .wave{animation:wave 2.4s linear infinite}
  .wave.fast{animation-duration:1.1s}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
  .bob{animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  .flash{opacity:0;transition:opacity .08s}
  .flash.on{opacity:.75}
  .situation{background:#fff6e0;border-left:8px solid #ff8a00;border-radius:10px;padding:12px 16px;margin:14px 0 10px;font-size:19px;line-height:1.9;color:#1d2b36}
  .question{font-size:24px;font-weight:bold;color:#fff;margin:6px 2px 12px;line-height:1.8}
  .choices{display:flex;flex-direction:column;gap:12px}
  /* 選択肢：スマホ（iOS）で青文字にならないよう濃い色を明示 */
  .choice{background:#fff;border:none;border-radius:14px;padding:18px 18px 18px 64px;font-size:19px;font-weight:600;text-align:left;position:relative;cursor:pointer;font-family:inherit;line-height:1.8;box-shadow:0 4px 0 #9fb3c4;color:#1a1a1a;-webkit-text-fill-color:#1a1a1a}
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 #9fb3c4;background:#ffe7c7}
  .choice .lb{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#0b2a45;color:#fff;-webkit-text-fill-color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:18px}

  /* ドキドキタイム */
  #s-drama{justify-content:center}
  .drama-title{color:#fff;font-size:26px;font-weight:bold;text-align:center;margin-bottom:12px;letter-spacing:.1em;line-height:1.8}
  .drama-title.beat{animation:beat .8s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
  .drama-wrap{position:relative}
  .caption{position:absolute;left:0;right:0;bottom:18px;text-align:center;line-height:1.6;pointer-events:none}
  .caption span{display:inline-block;background:rgba(0,0,0,.6);color:#fff;font-size:32px;font-weight:900;padding:8px 26px;border-radius:12px;opacity:0;animation:capin .8s ease forwards .6s}
  @keyframes capin{to{opacity:1}}
  .rise{animation:rise 3.8s cubic-bezier(.5,0,.8,.6) forwards}
  @keyframes rise{from{transform:translateY(0)}to{transform:translateY(-340px)}}
  .fadeout{animation:fadeout 3s ease forwards}
  @keyframes fadeout{to{opacity:0}}
  .fadein{opacity:0;animation:fadein 2s ease forwards 1.2s}
  @keyframes fadein{to{opacity:1}}
  .drift{animation:drift 6s ease-out forwards}
  @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(70px)}}
  .rock{animation:rock 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes rock{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-5px)}}
  .waveArm{animation:waveArm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left bottom}
  @keyframes waveArm{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
  .float{animation:float 6s ease-in-out forwards}
  @keyframes float{from{transform:translate(-60px,-30px)}to{transform:translate(80px,30px)}}
  .spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{from{transform:rotate(-20deg)}to{transform:rotate(30deg)}}
  .swimR{animation:swimR linear infinite}
  .swimL{animation:swimL linear infinite}
  @keyframes swimR{from{transform:translateX(-120px)}to{transform:translateX(780px)}}
  @keyframes swimL{from{transform:translateX(780px)}to{transform:translateX(-120px)}}
  .bubble{animation:bubble linear infinite}
  @keyframes bubble{from{transform:translateY(0);opacity:.8}to{transform:translateY(-380px);opacity:0}}
  .sway{animation:sway 3s ease-in-out infinite alternate}
  @keyframes sway{from{opacity:.05}to{opacity:.16}}
  .darken{opacity:0;animation:darken 5.5s ease forwards .5s}
  @keyframes darken{to{opacity:.5}}

  .result-head{text-align:center;padding:26px 16px;border-radius:18px;color:#fff}
  .pass{background:linear-gradient(135deg,#1e9e5a,#38c172)}
  .fail{background:linear-gradient(135deg,#8b0000,#d62828);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,40,40,.7)}50%{box-shadow:0 0 0 14px rgba(214,40,40,0)}}
  .score{font-size:84px;font-weight:900;line-height:1}
  .score small{font-size:30px}
  .verdict{font-size:30px;font-weight:bold;margin-top:8px;line-height:1.7}
  .warn{font-size:19px;margin-top:10px;line-height:1.9}
  .review{margin-top:16px}
  .review h3{font-size:21px;margin-bottom:10px;color:#0b2a45;line-height:1.8}
  .rv{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #e3e8ee;font-size:17px;line-height:1.9;color:#1d2b36}
  .rv:last-child{border-bottom:none}
  .mk{flex:0 0 46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#fff}
  .mk.g{background:#1e9e5a}.mk.m{background:#f0a500}.mk.b{background:#d62828}
  .rv b{color:#0b2a45}
  .adv{color:#a33a00}
  .btn-row{display:flex;gap:12px;margin-top:18px}
  .btn-sub{background:#e3e8ee;color:#0b2a45;-webkit-text-fill-color:#0b2a45;box-shadow:0 5px 0 #b3c0cc}
  .btn-primary{-webkit-text-fill-color:#fff}
  .note{color:#9db7cf;font-size:13px;text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="app">

  <!-- スタート画面（レベル選択） -->
  <section class="screen active" id="s-start">
    <h1>🌧️ 小金井市<br>水害サバイバルクイズ</h1>
    <p class="sub">大雨が降ってきた！ あなたは生きのびられる？　🔊 音が出ます</p>
    <div class="start-hero" id="hero"></div>
    <div class="lv-label">レベルを選んでスタート！</div>
    <div class="lv-row">
      <button class="lv-btn lv-easy" onclick="chooseLevel('easy')"><span class="n">初級編</span><span class="d">しょうがくせい・ちゅうがくせい むけ<br>ひらがなで よめる</span></button>
      <button class="lv-btn lv-hard" onclick="chooseLevel('hard')"><span class="n">上級編</span><span class="d">高校生・大人向け<br>悩ましい選択肢</span></button>
    </div>
    <p class="note">※ 本クイズの場面・数値は学習用のイメージです。実際の災害時は小金井市・気象庁などの最新情報に従ってください。</p>
  </section>

  <!-- シチュエーション選択 -->
  <section class="screen" id="s-select">
    <div style="text-align:center"><span class="lvtag" id="sel-tag"></span></div>
    <h1 style="font-size:28px" id="sel-h"></h1>
    <p class="sub" id="sel-sub"></p>
    <div class="grid" id="sc-grid"></div>
    <button class="back" id="sel-back" onclick="go('s-start')"></button>
  </section>

  <!-- 設問画面 -->
  <section class="screen" id="s-quiz">
    <div class="topbar">
      <div class="sc" id="q-sc"></div>
      <div class="progress"><div id="q-bar"></div></div>
      <div class="qno" id="q-no"></div>
      <button class="snd" id="snd-btn" onclick="toggleSound()">🔊 音あり</button>
    </div>
    <div class="scene" id="q-scene"></div>
    <div class="situation" id="q-sit"></div>
    <div class="question" id="q-text"></div>
    <div class="choices" id="q-choices"></div>
  </section>

  <!-- ドキドキタイム -->
  <section class="screen" id="s-drama">
    <div class="drama-title beat" id="d-title"></div>
    <div class="drama-wrap">
      <div class="scene" id="d-scene"></div>
      <div class="caption" id="d-cap"></div>
    </div>
  </section>

  <!-- 評価画面 -->
  <section class="screen" id="s-result">
    <div class="result-head" id="r-head"></div>
    <div class="card review">
      <h3 id="r-h3"></h3>
      <div id="r-list"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-sub" id="r-again" onclick="go('s-select')"></button>
      <button class="btn btn-primary" id="r-top" onclick="go('s-start')"></button>
    </div>
  </section>

</div>

<script>
/* =========================================================
   ▼ 動画の設定（任意）
   「シチュエーションID-問題番号」に動画ファイルを指定すると、その問題では
   イラストの代わりに動画（音声付き）を再生します（初級編・上級編共通）。
   シチュエーションID： home / car / office / school / park
   例） "home-3": "videos/home_q3.mp4",
   ドキドキタイム： "flood"=洪水 / "happy"=生存 / "bad"=サバイバル失敗
   ========================================================= */
const VIDEOS = {
  // "home-3": "videos/home_q3.mp4",
  // "flood": "videos/flood.mp4",
  // "happy": "videos/happy_end.mp4",
  // "bad":   "videos/bad_end.mp4",
};

/* ▼ ドキドキタイムの長さ（ミリ秒）：洪水 4秒 ＋ 生存／失敗 6秒 ＝ 10秒後に結果画面 */
const DRAMA_FLOOD_MS = 4000;
const DRAMA_END_MS   = 6000;

/* ふりがな記法：漢字《かんじ》 → ルビ表示 */
function rb(s){return String(s).replace(/([\u4E00-\u9FFF々〆]+)《([^》]+)》/g,'<ruby>$1<rt>$2</rt></ruby>');}

/* 画面の文言（初級編はふりがな付き） */

    back:"← レベル えらびに もどる",qno:(i,n)=>`${i}もんめ / ${n}`,
    fate:"あなたの うんめいは…",saved:"🛟 たすかった…！",lost:"🌊 …",
    capOK:"せいぞん！",capNG:"サバイバル しっぱい・・・",
    unit:"てん",perfect:"🏅 まんてん！ ぼうさい マスター",ok:"✅ ごうかく！ いきのびました",

    h3:"ふりかえりポイント",ans:"あなたの こたえ",correct:"せいかい！",best:"せいかいは",
    q:"",qq:"もんめ",again:"ほかの ばめんに チャレンジ",top:"さいしょの がめんへ"},
  hard:{tag:"上級編",tagc:"#d62828",selH:"あなたはいま、どこにいる？",
    selSub:"シチュエーションを1つ選んでください<br>（全5問・100点満点・60点以上で合格）",
    back:"← レベル選択にもどる",qno:(i,n)=>`第${i}問 / ${n}`,
    fate:"あなたの運命は…",saved:"🛟 助かった…！",lost:"🌊 …",
    capOK:"生存！",capNG:"サバイバル失敗・・・",
    unit:"点",perfect:"🏅 満点！ 防災マスター",ok:"✅ 合格！ 生きのびました",
    ng:"⚠️ 不合格 ― 命を落とす危険が高い状態です",

    ngMsg:"今回の行動では、実際の水害で<b>命を落とすリスクが高まります</b>。<br>下のアドバイスを確認し、もう一度挑戦してみましょう。",

    q:"第",qq:"問",again:"別のシチュエーションに挑戦",top:"最初の画面へ"}
};

/* =========================================================
   上級編 設問データ（s: 2=○ 20点 / 1=△ 10点 / 0=× 0点）
   ========================================================= */
const ALERT = {
  warn:{t:"大雨警報 発表",c:"#e8a200"},
  l3:{t:"警戒レベル3 高齢者等避難",c:"#d62828"},
  l4:{t:"警戒レベル4 避難指示",c:"#7b2cbf"},
  stop:{t:"雨は弱まりました",c:"#2a7fba"}
};

const HARD = [
 {id:"home",icon:"🏠",title:"自宅にいるとき",desc:"2階建ての家で家族と過ごしている",
  q:[
   {sit:"夕方、雨が強くなり、小金井市に<b>大雨警報</b>が発表されました。夜にかけてさらに強まる予報です。",

       {t:"おばあちゃんを歩かせるのは大変なので、車に乗せて避難所へ向かう",s:0}]},
   {sit:"避難が遅れてしまいました。外は<b>水深 約40cm</b>で、水に流れも出てきています。",

    tip:"流れのある水は、膝くらいの深さでも大人が足をとられます。家族で体を結んでも、全員が流される危険が高まるだけです。外へ出ず、すぐに上の階で救助を求めましょう。",

       {t:"1階の貴重品や家電を2階へ運び上げてから、2階に避難する",s:1},
       {t:"はぐれないように家族の体をひもで結び、みんなで避難所まで歩く",s:0}]},
   {sit:"雨がやみ、水が引き始めました。1階は泥だらけで、電気は止まっています。",

/* =========================================================
   効果音（ブラウザ内で合成するため音声ファイル不要）
   ========================================================= */
const AU={ctx:null,on:true,timer:null};
function audioInit(){
  try{
    if(!AU.ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
      const ctx=AU.ctx=new C();
      const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      AU.noise=buf; AU.master=ctx.createGain(); AU.master.connect(ctx.destination);
      const mk=(type,freq,q)=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AU.master);s.start();return g;};
      AU.rainG=mk("bandpass",2600,0.5);
      AU.heavyG=mk("lowpass",900,0.7);
      AU.waterG=mk("lowpass",320,1.2);
      AU.deepG=mk("lowpass",140,2.0);
    }
    if(AU.ctx.state!=="running")AU.ctx.resume();
  }catch(e){}
}
function setAmbient(rain,depth){
  if(!AU.ctx)return; const t=AU.ctx.currentTime;
  AU.rainG.gain.setTargetAtTime([0,.05,.10,.16,.24][rain],t,.6);
  AU.heavyG.gain.setTargetAtTime([0,0,.05,.12,.22][rain],t,.6);
  AU.waterG.gain.setTargetAtTime(depth>=40?.55:depth>=15?.3:0,t,.6);
  AU.deepG.gain.setTargetAtTime(0,t,.3);
  clearInterval(AU.timer);
  if(rain>=3){AU.timer=setInterval(()=>{if(Math.random()<.55)thunder();},rain>=4?4500:7500);setTimeout(thunder,900);}
}
function stopAmbient(){if(!AU.ctx)return;clearInterval(AU.timer);const t=AU.ctx.currentTime;[AU.rainG,AU.heavyG,AU.waterG,AU.deepG].forEach(g=>g.gain.setTargetAtTime(0,t,.3));}
function thunder(){
  flash();
  if(!AU.ctx)return; const ctx=AU.ctx,t=ctx.currentTime+.25;
  const s=ctx.createBufferSource();s.buffer=AU.noise;const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(120,t+2.5);
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+3.2);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+3.3);
}
function flash(){const f=document.querySelector(".screen.active .flash");if(!f)return;f.classList.add("on");setTimeout(()=>f.classList.remove("on"),90);setTimeout(()=>f.classList.add("on"),180);setTimeout(()=>f.classList.remove("on"),260);}
function tone(freq,start,dur,type="square",vol=.12){
  const ctx=AU.ctx,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol,start+.02);g.gain.setValueAtTime(vol,start+dur-.03);g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g);g.connect(AU.master);o.start(start);o.stop(start+dur);
}
function alarm(kind){
  if(!AU.ctx)return; const t=AU.ctx.currentTime+.1;
  if(kind==="l4"||kind==="l3"){const n=kind==="l4"?6:4;for(let i=0;i<n;i++){tone(i%2?740:990,t+i*.32,.3,"square",kind==="l4"?.13:.1);}}
  else if(kind==="warn"){[880,880,880].forEach((f,i)=>tone(f,t+i*.4,.22,"sine",.18));}
  else if(kind==="stop"){[660,880].forEach((f,i)=>tone(f,t+i*.25,.3,"sine",.12));}
}
function heartbeat(n){
  if(!AU.ctx)return; const t=AU.ctx.currentTime+.05;
  for(let i=0;i<n;i++){tone(60,t+i*.8,.12,"sine",.5);tone(55,t+i*.8+.22,.12,"sine",.4);}
}
function toggleSound(){
  AU.on=!AU.on; document.getElementById("snd-btn").textContent=AU.on?"🔊 音あり":"🔇 消音";
  if(AU.master)AU.master.gain.value=AU.on?1:0;
  document.querySelectorAll("video").forEach(v=>v.muted=!AU.on);
}

const W=640,H=360,G=292;let UID=0;

function sky(rain){
  const top=["#7cc4f2","#8aa3b8","#5f7385","#3e4d5a","#232b33"][rain],bot=["#cfeaff","#b7c4cf","#8e9ba6","#66717b","#424a52"][rain];
  return `<defs><linearGradient id="sk${UID}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>
  <linearGradient id="wt${UID}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6a45" stop-opacity=".75"/><stop offset="1" stop-color="#5a4128" stop-opacity=".9"/></linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sk${UID})"/>
  ${rain>0?clouds(rain):'<circle cx="560" cy="60" r="34" fill="#ffe27a" opacity=".9"/>'}`;

function clouds(r){
  let s="";for(let i=0;i<6;i++){const x=i*120-20,y=20+(i%2)*14;
  s+=`<g fill="${r>2?'#2f3943':'#9aa6b1'}" opacity=".95"><ellipse cx="${x+60}" cy="${y+20}" rx="70" ry="28"/><ellipse cx="${x+20}" cy="${y+28}" rx="45" ry="22"/><ellipse cx="${x+105}" cy="${y+28}" rx="45" ry="22"/></g>`;}
  return s;
}
function rainLines(r){

  let s=`<g class="rainfall" stroke="#d9ecff" stroke-width="${r>2?2.4:1.6}" opacity=".75" stroke-linecap="round" style="animation-duration:${[0,.7,.5,.38,.28][r]}s">`;
  for(let i=0;i<n;i++){const x=rnd(i+1)*(W+120),y=rnd(i+99)*(H+120)-120,l=14+r*6;s+=`<line x1="${x}" y1="${y}" x2="${x-l*.35}" y2="${y+l}"/>`;}

function buildSVG(sc){
  UID++;
  let body="";
  switch(sc.type){
    case "house":body=ground()+house();break;
    case "office":body=ground()+office();break;
    case "school":body=ground()+school();break;
    case "park":body=ground("park")+park(sc.river);break;
    case "shelter":body=ground()+shelter()+person(250,G,"#2a9d8f");break;
    case "underpass":body=underpass()+car(40,G,false);break;
    case "car":body=ground()+car(220,G+20,sc.extra.includes("stall"));break;
  }
  let fg="";
  if(sc.type==="house"&&!sc.extra.length)fg+=person(250,G)+(sc.rain?umbrella(250,G):"");
  if(sc.type==="office"&&!sc.extra.length)fg+=person(260,G,"#264653");
  if(sc.type==="school")fg+=person(220,G,"#e76f51",.8)+person(180,G,"#2a9d8f",.85);
  if(sc.type==="park"&&!sc.extra.includes("walker"))fg+=person(230,G,"#e76f51",.85);
  if(sc.extra.includes("walker"))fg+=person(230,G)+`<line x1="246" y1="${G-50}" x2="262" y2="${G+4}" stroke="#333" stroke-width="3"/>`;
  if(sc.extra.includes("grandma"))fg+=grandma();
  if(sc.extra.includes("hazard"))fg+=hazardMap();
  if(sc.extra.includes("breaker"))fg+=breaker();
  if(sc.extra.includes("phone"))fg+=phone();
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${sky(sc.rain)}${body}${fg}${water(sc.depth)}${rainLines(sc.rain)}${alertBox(sc.alert)}<rect class="flash" width="${W}" height="${H}" fill="#fff"/></svg>`;
}

function playVideo(el,src,onfail){
  el.innerHTML=`<video playsinline preload="auto" src="${src}"></video>`;
  const v=el.querySelector("video"); v.muted=!AU.on; v.onerror=onfail;
  const p=v.play(); if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{});});
}
let dramaTimers=[];
function playDrama(pass,done){
  dramaTimers.forEach(clearTimeout); dramaTimers=[];
  const T=UI[LV];
  const el=document.getElementById("d-scene"),cap=document.getElementById("d-cap"),title=document.getElementById("d-title");
  title.innerHTML=rb(T.fate); title.className="drama-title beat"; cap.innerHTML="";
  go("s-drama",true);
  // ① 洪水（5秒）
  const floodAnim=()=>{el.innerHTML=floodSVG();if(AU.ctx){const t=AU.ctx.currentTime;AU.rainG.gain.setTargetAtTime(.25,t,.3);AU.heavyG.gain.setTargetAtTime(.3,t,.3);AU.waterG.gain.setTargetAtTime(.9,t,1.5);}setTimeout(thunder,600);setTimeout(thunder,2600);heartbeat(5);};
  if(VIDEOS.flood){stopAmbient();playVideo(el,VIDEOS.flood,floodAnim);} else floodAnim();
  // ② 生存／サバイバル失敗（6秒）
  dramaTimers.push(setTimeout(()=>{
    title.className="drama-title";
    title.innerHTML=rb(pass?T.saved:T.lost);
    cap.innerHTML=`<span>${rb(pass?T.capOK:T.capNG)}</span>`;
    const anim=()=>{
      el.innerHTML=pass?happySVG():badSVG();
      if(AU.ctx){const t=AU.ctx.currentTime;clearInterval(AU.timer);
        AU.rainG.gain.setTargetAtTime(0,t,.4);AU.heavyG.gain.setTargetAtTime(0,t,.4);
        if(pass){AU.waterG.gain.setTargetAtTime(.12,t,.8);[523,659,784,659,784,1047].forEach((f,i)=>tone(f,t+.4+i*.22,.3,"triangle",.12));}
        else{AU.waterG.gain.setTargetAtTime(0,t,.3);AU.deepG.gain.setTargetAtTime(.9,t,.5);[110,104,98].forEach((f,i)=>tone(f,t+.3+i*1.6,1.5,"sine",.25));}
      }
    };
    const v=VIDEOS[pass?"happy":"bad"];
    if(v){stopAmbient();playVideo(el,v,anim);} else anim();
  },DRAMA_FLOOD_MS));
  // ③ 結果画面へ（合計10秒）
  dramaTimers.push(setTimeout(()=>{stopAmbient();done();},DRAMA_FLOOD_MS+DRAMA_END_MS));
}

function showScene(el,sc,videoSrc){
  el.classList.toggle("shake",sc.depth>=40&&sc.rain>=4);
  if(videoSrc){
    el.innerHTML=`<video playsinline loop preload="auto" src="${videoSrc}"></video>`;
    const v=el.querySelector("video");
    v.muted=!AU.on;
    v.onerror=()=>{el.innerHTML=buildSVG(sc);setAmbient(sc.rain,sc.depth);alarm(sc.alert);};
    stopAmbient();
    const p=v.play(); if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{});});
  }else{
    el.innerHTML=buildSVG(sc);
    setAmbient(sc.rain,sc.depth); alarm(sc.alert);
  }
}

/* =========================================================
   画面制御
   ========================================================= */
let LV="easy",DATA=EASY,cur=null,idx=0,answers=[],order=[];
function go(id,keepSound){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0);
  document.querySelectorAll(".screen:not(.active) video").forEach(v=>v.pause());
  if(id!=="s-drama"){dramaTimers.forEach(clearTimeout);dramaTimers=[];}
  if(id!=="s-quiz"&&!keepSound)stopAmbient();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

document.getElementById("hero").innerHTML=buildSVG({type:"house",rain:4,depth:30,alert:"warn",extra:[]});

function chooseLevel(lv){
  audioInit();
  LV=lv; DATA=lv==="easy"?EASY:HARD; const T=UI[lv];
  const tag=document.getElementById("sel-tag"); tag.innerHTML=rb(T.tag); tag.style.background=T.tagc;
  document.getElementById("sel-h").innerHTML=rb(T.selH);
  document.getElementById("sel-sub").innerHTML=rb(T.selSub);
  document.getElementById("sel-back").innerHTML=rb(T.back);
  document.getElementById("r-h3").innerHTML=rb(T.h3);
  document.getElementById("r-again").innerHTML=rb(T.again);
  document.getElementById("r-top").innerHTML=rb(T.top);
  document.getElementById("sc-grid").innerHTML=DATA.map((s,i)=>
    `<button class="sc-btn" onclick="startQuiz(${i})"><div class="ic">${s.icon}</div><div class="t">${rb(s.title)}</div><div class="d">${rb(s.desc)}</div></button>`).join("");
  go("s-select");
}
function startQuiz(i){audioInit();cur=DATA[i];idx=0;answers=[];go("s-quiz");render();}
function render(){
  const q=cur.q[idx],T=UI[LV];
  document.getElementById("q-sc").innerHTML=`${cur.icon} ${rb(cur.title)}`;
  document.getElementById("q-no").innerHTML=rb(T.qno(idx+1,cur.q.length));
  document.getElementById("q-bar").style.width=`${idx/cur.q.length*100}%`;
  showScene(document.getElementById("q-scene"),q.scene,VIDEOS[`${cur.id}-${idx+1}`]);
  document.getElementById("q-sit").innerHTML=rb(q.sit);
  document.getElementById("q-text").innerHTML="Q. "+rb(q.q);
  const lbs=["A","B","C","D"];
  order=shuffle(q.c.map((_,k)=>k));
  document.getElementById("q-choices").innerHTML=order.map((ci,k)=>
    `<button class="choice" data-i="${ci}"><span class="lb">${lbs[k]}</span>${rb(q.c[ci].t)}</button>`).join("");
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  window.scrollTo(0,0);
}
function pick(ci){
  audioInit();
  const c=cur.q[idx].c[ci];
  answers.push({s:c.s,t:c.t});
  idx++;
  if(idx<cur.q.length)render(); else showResult();
}
function showResult(){
  const T=UI[LV];
  const score=answers.reduce((a,x)=>a+x.s*10,0); // ○20点・△10点・×0点 × 5問 = 100点
  const pass=score>=60;
  const head=document.getElementById("r-head");
  head.className="result-head "+(pass?"pass":"fail");
  head.innerHTML=`<div style="font-size:20px">${cur.icon} ${rb(cur.title)}</div>
   <div class="score">${score}<small> / 100${rb(T.unit)}</small></div>
   <div class="verdict">${rb(pass?(score===100?T.perfect:T.ok):T.ng)}</div>
   <div class="warn">${rb(pass?T.okMsg:T.ngMsg)}</div>`;
  const mk={2:["g","○"],1:["m","△"],0:["b","×"]};
  document.getElementById("r-list").innerHTML=cur.q.map((q,i)=>{
    const a=answers[i],best=q.c.find(c=>c.s===2).t,[cls,sym]=mk[a.s];
    return `<div class="rv"><div class="mk ${cls}">${sym}</div><div>
      <b>${rb(T.q)}${i+1}${rb(T.qq)}：</b>${rb(T.ans)}「${rb(a.t)}」（${a.s*10}${rb(T.unit)}）<br>
      ${a.s===2?`<span style="color:#1e9e5a">${rb(T.correct)}</span> ${rb(q.tip)}`:`<span class="adv">▶ ${rb(T.best)}${LV==="easy"?" ":"："}「${rb(best)}」</span><br>${LV==="easy"?"💡 ":""}${rb(q.tip)}`}
    </div></div>`;}).join("");
  document.getElementById("q-bar").style.width="100%";
  playDrama(pass,()=>{
    go("s-result");
    if(AU.ctx){const t=AU.ctx.currentTime+.1;(pass?[523,659,784,1047]:[392,330,262]).forEach((f,i)=>tone(f,t+i*.18,.25,"sine",.15));}
  });
}
</script>
</body>
</html>
